# Hermie for the Mac: a native SwiftUI app on AppKit, with its own scenes,
# entitlements and sandbox. Generate with native/apple/scripts/generate.sh.

name: Hermie

include:
  - ../apple/xcodegen/base.yml

targets:
  Hermie:
    templates:
      - HermieApp
    platform: macOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - Hermie.entitlements
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        # The sandbox and everything it is opened for are declared in the
        # entitlements file alone, so there is one place to audit them.
        CODE_SIGN_ENTITLEMENTS: App/Hermie.entitlements
        COMBINE_HIDPI_IMAGES: YES

  # Embedded in the app (see the HermieApp template in base.yml for the shared
  # half of both extensions). Every Mac extension is sandboxed; the
  # entitlements files say what each is opened for.
  HermieWidgetsExtension:
    templates:
      - HermieWidgets
    platform: macOS
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: ../apple/Extensions/Widgets/HermieWidgets-macOS.entitlements

  HermieShareExtension:
    templates:
      - HermieShare
    platform: macOS
    sources:
      - path: ../apple/Extensions/Share/macOS
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: ../apple/Extensions/Share/HermieShare-macOS.entitlements

  # A debug-only host for the transcript UI tests: HermieUI's debug screens
  # and nothing else, under its own bundle id. Signed ad hoc, unsandboxed, and
  # never shipped. Run with `scripts/test.sh --ui-mac`, which drives the real
  # pointer for as long as it runs.
  HermieLab:
    type: application
    platform: macOS
    sources:
      - path: ../apple/Lab
    dependencies:
      - package: HermieKit
        product: HermieUI
    settings:
      base:
        PRODUCT_NAME: HermieLab
        PRODUCT_BUNDLE_IDENTIFIER: dev.hermie.lab
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: '-'
        DEVELOPMENT_TEAM: ''
        SWIFT_VERSION: '6.0'
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES

  HermieLabUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: ../apple/UITests
    dependencies:
      - target: HermieLab
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.hermie.lab.ui-tests
        TEST_TARGET_NAME: HermieLab
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: '-'
        DEVELOPMENT_TEAM: ''
        SWIFT_VERSION: '6.0'
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES

schemes:
  HermieLab:
    build:
      targets:
        HermieLab: all
        HermieLabUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HermieLabUITests
