# Hermie for iPhone and iPad. Generate with native/apple/scripts/generate.sh.

name: Hermie

include:
  - ../apple/xcodegen/base.yml

targets:
  Hermie:
    templates:
      - HermieApp
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - Hermie.entitlements
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Hermie.entitlements
        # iPhone and iPad.
        TARGETED_DEVICE_FAMILY: '1,2'
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO

  # Embedded in the app (see the HermieApp template in base.yml for the shared
  # half of both extensions).
  HermieWidgetsExtension:
    templates:
      - HermieWidgets
    platform: iOS
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: ../apple/Extensions/Widgets/HermieWidgets-iOS.entitlements
        TARGETED_DEVICE_FAMILY: '1,2'

  HermieShareExtension:
    templates:
      - HermieShare
    platform: iOS
    sources:
      - path: ../apple/Extensions/Share/iOS
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: ../apple/Extensions/Share/HermieShare-iOS.entitlements
        TARGETED_DEVICE_FAMILY: '1,2'

  # KeychainStore and ICloudKeychainStore against the real keychain, hosted in
  # the app so they run with the app's keychain access group. Run with
  # `scripts/test.sh --keychain`, which uses a throwaway simulator.
  HermieKeychainTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../apple/HostedTests
      - path: ../apple/HermieKit/Tests/HermieStoreTests/SecretStoreContract.swift
      - path: ../apple/HermieKit/Tests/HermieStoreTests/SyncedItemStoreContract.swift
    dependencies:
      - target: Hermie
      - package: HermieKit
        product: HermieStore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.hermie.app.keychain-tests
        # Simulator only: the test host is the app itself, and on a device it
        # would install over a real Hermie and run in its keychain group.
        SUPPORTED_PLATFORMS: iphonesimulator
        SWIFT_VERSION: '6.0'
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Hermie.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Hermie
        BUNDLE_LOADER: $(TEST_HOST)

  # The app shell on a simulator: first frame, lock, deep links, split view and
  # the accessibility audits. Run with `scripts/test.sh --ui`, which uses a
  # throwaway iPhone and iPad. The app runs on its own data directory with a
  # scripted authenticator (`-HermieUITest`, debug builds only).
  HermieShellUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ../apple/ShellUITests
    dependencies:
      - target: Hermie
      - package: HermieKit
        product: HermieGateway
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.hermie.app.shell-ui-tests
        SUPPORTED_PLATFORMS: iphonesimulator
        TARGETED_DEVICE_FAMILY: '1,2'
        SWIFT_VERSION: '6.0'
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        TEST_TARGET_NAME: Hermie

  # A debug-only host for the transcript UI tests: HermieUI's debug screens
  # and nothing else, under its own bundle id, so the tests never install over
  # the real app or meet its keychain group. Run with `scripts/test.sh --ui`.
  HermieLab:
    type: application
    platform: iOS
    sources:
      - path: ../apple/Lab
    dependencies:
      - package: HermieKit
        product: HermieUI
    settings:
      base:
        PRODUCT_NAME: HermieLab
        PRODUCT_BUNDLE_IDENTIFIER: dev.hermie.lab
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: '1,2'
        SUPPORTED_PLATFORMS: iphonesimulator
        SWIFT_VERSION: '6.0'
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES

  HermieLabUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ../apple/UITests
    dependencies:
      - target: HermieLab
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.hermie.lab.ui-tests
        TEST_TARGET_NAME: HermieLab
        SUPPORTED_PLATFORMS: iphonesimulator
        TARGETED_DEVICE_FAMILY: '1,2'
        SWIFT_VERSION: '6.0'
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES

schemes:
  HermieLab:
    build:
      targets:
        HermieLab: all
        HermieLabUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HermieLabUITests
  HermieShellUITests:
    build:
      targets:
        Hermie: all
        HermieShellUITests: [test]
    test:
      targets:
        - HermieShellUITests
  HermieKeychainTests:
    build:
      targets:
        Hermie: all
        HermieKeychainTests: [test]
    test:
      targets:
        - HermieKeychainTests
