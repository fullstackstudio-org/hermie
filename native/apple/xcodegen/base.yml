# Shared by native/ios/project.yml and native/macos/project.yml, which include
# this file. Paths here are relative to this file.
#
# The generated .xcodeproj is never committed: change a spec, then run
# native/apple/scripts/generate.sh.

options:
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top
  deploymentTarget:
    iOS: '26.0'
    macOS: '26.0'

packages:
  HermieKit:
    path: ../HermieKit

targetTemplates:
  # One app target. Everything that is not platform-specific comes from
  # Config/Shared.xcconfig, so a setting has one home whichever project builds
  # it; the platform spec adds sources, Info.plist and entitlements.
  HermieApp:
    type: application
    configFiles:
      Debug: ../Config/Shared.xcconfig
      Release: ../Config/Shared.xcconfig
    settings:
      base:
        # XcodeGen's presets would otherwise derive these at the target level,
        # where they win over the xcconfig.
        PRODUCT_NAME: Hermie
        PRODUCT_BUNDLE_IDENTIFIER: $(HERMIE_BUNDLE_ID)
        GENERATE_INFOPLIST_FILE: NO
    # The App Intents and the App Shortcuts live in the APP target, as they did in
    # the Expo build: an `AppShortcutsProvider` is only found in the app, and the
    # intents metadata is extracted from the sources the target itself compiles.
    sources:
      - path: ../Extensions/Intents
        excludes:
          - '**/*.xcstrings'
    dependencies:
      - package: HermieKit
        product: HermieUI
      - package: HermieKit
        product: HermieCore
      - package: HermieKit
        product: HermieShared
      - target: HermieWidgetsExtension
      - target: HermieShareExtension
    scheme: {}

  # The widgets: one chat, three chats or one folder, and "N need input". They
  # read the snapshot the app writes into the App Group and nothing else.
  # The bundle id is the Expo build's in Release, so its App ID and profiles carry
  # over (HERMIE_BUNDLE_ID in Config/Shared.xcconfig).
  HermieWidgets:
    type: app-extension
    configFiles:
      Debug: ../Config/Shared.xcconfig
      Release: ../Config/Shared.xcconfig
    sources:
      - path: ../Extensions/Widgets
        excludes:
          - Info.plist
          - '*.entitlements'
          - '**/*.xcstrings'
      - path: ../Extensions/Common
    settings:
      base:
        PRODUCT_NAME: HermieWidgetsExtension
        PRODUCT_BUNDLE_IDENTIFIER: $(HERMIE_BUNDLE_ID).widgets
        INFOPLIST_FILE: $(SRCROOT)/../apple/Extensions/Widgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - package: HermieKit
        product: HermieShared

  # The share extension: pick a chat, add a note, and either send it directly
  # (ADR-0026) or leave it in the outbox for the app. Links HermieStore for the
  # one keychain item it may read. The bundle id is the Expo build's in Release.
  HermieShare:
    type: app-extension
    configFiles:
      Debug: ../Config/Shared.xcconfig
      Release: ../Config/Shared.xcconfig
    sources:
      - path: ../Extensions/Share
        excludes:
          - Info.plist
          - '*.entitlements'
          - iOS
          - macOS
          - '**/*.xcstrings'
      - path: ../Extensions/Common
    settings:
      base:
        PRODUCT_NAME: HermieShareExtension
        PRODUCT_BUNDLE_IDENTIFIER: $(HERMIE_BUNDLE_ID).share
        INFOPLIST_FILE: $(SRCROOT)/../apple/Extensions/Share/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - package: HermieKit
        product: HermieShared
      - package: HermieKit
        product: HermieShareKit
      - package: HermieKit
        product: HermieStore
