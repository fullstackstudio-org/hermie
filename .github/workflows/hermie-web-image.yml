name: Hermie Web image

# Publishes packages/hermie-web as a container image to GHCR. This is
# separate from release.yml on purpose: that workflow ships hermie-web.zip
# for a bare-metal install, and this ships the same build as an image for
# anyone who would rather `docker run` it. Both start from the same
# `npm run web:build` output, so a version published here is exactly the
# version in that zip.
#
# The Dockerfile only copies an already-built `dist` onto node:22-alpine —
# its one RUN step is a symlink, nothing is compiled inside the image — so
# cross-building linux/arm64 under QEMU costs this job seconds, not minutes.
#
# A tag push publishes the tagged release. workflow_dispatch exists so a
# specific commit can be republished (a hotfix image, a re-run after a
# registry hiccup) without cutting a new tag.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA to build
        required: true
        type: string
      version:
        description: Version to tag the image with (e.g. 0.2.0)
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.ref || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and publish
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      # A manual dispatch names its own ref and version; a tag push takes the
      # ref it was triggered from and reads the version off the tag name.
      - name: Resolve the ref and version
        id: vars
        # Inputs reach the shell as environment variables, never spliced into
        # the script text, and are checked before anything uses them: a ref is
        # a full or short commit SHA, a version is a plain semver string.
        env:
          INPUT_REF: ${{ inputs.ref }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]; then
            ref=$INPUT_REF
            version=$INPUT_VERSION
          else
            ref=$GITHUB_SHA
            version=${GITHUB_REF_NAME#v}
          fi
          [[ "$ref" =~ ^[0-9a-f]{7,40}$ ]] || { echo "not a commit SHA: $ref" >&2; exit 1; }
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || { echo "not a version: $version" >&2; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.vars.outputs.ref }}

      - name: Short SHA
        id: sha
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Build the server and the browser bundle
        run: npm run web:build

      # `latest` should track the newest published version, not whatever a
      # one-off dispatch happens to build. A tag push always qualifies — a
      # release tag IS the newest version by definition. A manual dispatch
      # only qualifies when the ref it named is main's current tip right now;
      # anything else (an older commit, a hotfix branch) is published under
      # its version tag alone.
      - name: Is this ref latest
        id: latest
        run: |
          if [ '${{ github.event_name }}' = 'push' ]; then
            echo 'is_latest=true' >> "$GITHUB_OUTPUT"
          else
            # actions/checkout does not set up a full remote-tracking refspec,
            # so `origin/main` may not exist locally — FETCH_HEAD is what this
            # fetch actually wrote and needs no refspec to read back.
            git fetch origin main --depth=1
            if [ "$(git rev-parse FETCH_HEAD)" = "$(git rev-parse HEAD)" ]; then
              echo 'is_latest=true' >> "$GITHUB_OUTPUT"
            else
              echo 'is_latest=false' >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Compute the image tags
        id: tags
        run: |
          TAGS="ghcr.io/fullstackstudio-org/hermie-web:${{ steps.vars.outputs.version }}
          ghcr.io/fullstackstudio-org/hermie-web:${{ steps.vars.outputs.version }}-${{ steps.sha.outputs.short }}"
          if [ '${{ steps.latest.outputs.is_latest }}' = 'true' ]; then
            TAGS="$TAGS
          ghcr.io/fullstackstudio-org/hermie-web:latest"
          fi
          {
            echo 'tags<<EOF'
            echo "$TAGS"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: packages/hermie-web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/fullstackstudio-org/hermie
            org.opencontainers.image.revision=${{ steps.vars.outputs.ref }}
            org.opencontainers.image.version=${{ steps.vars.outputs.version }}
            org.opencontainers.image.licenses=MIT

      - name: Record the digest
        run: |
          {
            echo "### Hermie Web image"
            echo
            echo "- \`ghcr.io/fullstackstudio-org/hermie-web@${{ steps.push.outputs.digest }}\`"
            echo "- version: \`${{ steps.vars.outputs.version }}\`"
            echo "- ref: \`${{ steps.vars.outputs.ref }}\`"
            echo "- tags:"
            while IFS= read -r tag; do
              [ -n "$tag" ] && echo "  - \`$tag\`"
            done <<< "${{ steps.tags.outputs.tags }}"
          } >> "$GITHUB_STEP_SUMMARY"

          # Also on stdout, in a single greppable line: the step summary has
          # no API to fetch it back from outside the run's own web page, and
          # a job output only exists for another job in the SAME run to read
          # (`needs.<job>.outputs`) — nothing external can query it either.
          # A caller that wants this digest from a script (release.sh's image
          # publish step) has to read it out of the job's plain log instead.
          echo "digest=${{ steps.push.outputs.digest }}"
