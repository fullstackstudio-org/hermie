name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Static checks and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # check-commit-messages needs the branch history, not just the tip.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format

      - name: Unit tests
        run: npm test

      # The runner has two cores; say so, rather than let jest size its own pool.
      # Called on the workspace directly: `npm run test:app -- …` would hand the
      # flag to the nested npm call as an npm option instead of to jest.
      - name: App tests
        run: npm run test --workspace @hermie/app -- --maxWorkers=2

      # The browser export is the one build a static check cannot stand in for:
      # a native-only import added to a shared file compiles, typechecks and
      # lints perfectly and then fails to bundle for the web. Ten seconds here
      # is what keeps `packages/hermie-web` from shipping an app that cannot be
      # built any more.
      - name: The web build still exports
        run: npm run web:build

      - name: Vendored sources are in sync
        run: npm run sync:hermes-shared:check

      - name: Icons match the design source
        run: npm run icons:check

      # The corpus the native port replays (contract/README.md). Fails when the
      # TS engine, the gateway client's pure functions or the fake gateway
      # changed without `npm run golden` being run and committed.
      - name: The golden corpus matches the TypeScript reference
        run: npm run golden:check

      # The native apps' String Catalog and Swift accessors (docs/i18n.md, "Native
      # apps"). Fails when a TypeScript string changed without `npm run i18n`.
      - name: The native string export matches the TypeScript catalogues
        run: npm run i18n:check

      - name: Ink clears AA on every composited surface
        run: npm run contrast:check

      - name: Third-party licences match the dependency tree
        run: npm run licences:check

      - name: Commit messages
        if: github.event_name == 'pull_request'
        run: node scripts/check-no-trailers.mjs origin/${{ github.base_ref }}..HEAD

  # The browser client in `native/web` (React + Vite, served by the hermie
  # plugin). Types, lint and format run in `check` like every other workspace;
  # this job owns what only a build can prove: that the bundle fits what the
  # gateway's static route and the plugin scanner accept, and that the same
  # commit always builds to the same bytes, because the plugin's own CI rebuilds
  # the commit named in `build.json` somewhere else and compares every file;
  # and that the transcript list meets its performance budgets in Chromium.
  # A sibling job rather than steps of `check`, so a bundle problem is not
  # buried under the app's tests and the two run side by side. What a browser
  # does with the built client, in all three engines, is `web-client-e2e` below.
  web-client:
    name: Web client (build, bundle gate, reproducibility)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm run client:test

      - name: Build
        run: npm run client:build

      # Extension allow-list, 900 kB per file, 3 MB and 80 files in all, ASCII
      # only, 700 kB / 230 kB gzip of initial JavaScript, and build.json matching
      # every file. `--commit` also requires it to name the commit under test.
      - name: Bundle gate
        run: npm run client:check-bundle -- --commit "$(git rev-parse HEAD)"

      # The Hermes plugin scanner over the build, as the plugin's own `guard-scan`
      # job will run it over the tree the build is imported into (plan W3): the
      # fork the gateways run and upstream, each fetched at the commit pinned in
      # `scripts/web/scanner-pins.json`, with `dist/` laid under `dashboard/app`
      # next to a manifest. Passes only on a `safe` verdict. The first finding
      # this found was a real one: upstream read a regular expression of the
      # Markdown code as an inline shell snippet. The second step is the gate's
      # own test against the real scanners: the real build passes and a build with
      # a planted critical pattern does not. Both need the network (a sparse fetch
      # of `tools/`, a few megabytes) and the runner's Python.
      - name: Plugin scanner (fork and upstream, pinned)
        run: npm run client:guard-scan

      - name: The scanner gate fails a planted pattern
        run: npx vitest run scripts/web/guard-scan
        env:
          GUARD_SCAN_REAL: '1'

      # The transcript list against its budgets (plan W-8): 60 s of a reply
      # streaming into a 5,000-item chat at 4x CPU throttling (no task over
      # 50 ms, under 1 % of frames dropped, no drift while reading, pinned at
      # the bottom), a cached chat painted within 300 ms, and the recorded
      # stream scenarios drawn as their checkpoints say. Chromium only here;
      # WebKit and Firefox run locally (`npm run client:e2e:perf`). It runs on
      # the development-only harness build (`dist-harness/`), never on `dist/`.
      # It stays in this job, not in `web-client-e2e`: its budgets are Chromium
      # measures, it needs a machine to itself for a minute of throttled
      # streaming (one job per runner gives it that), and a miss belongs beside
      # the bundle budgets rather than among three engines' behaviour checks.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Transcript list performance (Chromium)
        run: npm run e2e:perf:chromium --workspace @hermie/web-client

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: hermie-web-client-perf-results
          path: native/web/test-results
          if-no-files-found: ignore

      # Two clean builds with different time zones and locales, plus one from
      # `git archive HEAD` unpacked into another directory with its own `npm ci`.
      # Every file must be identical, not only build.json.
      - name: The same commit builds to the same bytes
        run: npm run client:check-reproducible -- --fresh-checkout

      # What would be imported into the plugin, and the source maps that must
      # not go with it.
      - uses: actions/upload-artifact@v4
        with:
          name: hermie-web-client-dist
          path: native/web/dist
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: hermie-web-client-maps
          path: native/web/dist-maps
          if-no-files-found: error

  # The web client in a browser, end to end: the real production build served by
  # the fake gateway's copy of the dashboard's static route, in Chromium, WebKit
  # and Firefox, one job each so that a failure in one engine does not hide the
  # others and the three run side by side (plan W-12). `e2e/fixtures.ts` builds
  # the client and starts a gateway of its own per test; the specs are sign-in
  # and session loss, the chat (list, open, stream, send, stop, a dropped
  # socket), the request layer (approval, clarify, withdrawn, restored), and axe
  # in both colour schemes on every screen and sheet. Any console error or
  # content-security-policy violation fails the test that caused it.
  #
  # No path filter, on purpose: this workflow runs on every pull request and every
  # job in it does, so a required `Web client end to end` check always starts. A
  # check that is required and filtered by path never reports on a pull request
  # that touches none of the paths, and that pull request cannot be merged. The
  # price is three browsers on a documentation-only change; if that becomes too
  # dear the right fix is a path filter inside the job that still reports success
  # (skip the steps, not the job), not a trigger filter.
  web-client-e2e:
    name: Web client end to end (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit, firefox]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Install ${{ matrix.browser }} for Playwright
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: End-to-end and accessibility specs
        run: npm run e2e --workspace @hermie/web-client -- --project=${{ matrix.browser }}

      # A trace of every failed test: `npx playwright show-trace <file>`.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: hermie-web-client-e2e-traces-${{ matrix.browser }}
          path: native/web/test-results
          if-no-files-found: ignore

  # `check` above runs the JavaScript/TypeScript suites; it has no `cargo test`
  # anywhere, so the desktop bridge's ACL guarantees (`src/acl.rs`,
  # `src/gateways.rs`) were until now proven only on a developer's own machine.
  # A sibling job rather than a step of `check`: it needs no Node install, and
  # running independently — nothing here `needs: check` and nothing needs it —
  # keeps it off that job's critical path instead of adding its runtime on top.
  # `macos-latest` needs no extra system packages for this: unlike Linux,
  # Tauri's desktop crate links against the system WebKit that ships with the
  # image, not webkit2gtk.
  desktop-rust-tests:
    name: Desktop bridge (cargo test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: cargo test
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked

  # The native builds are the slow, expensive half: they run on demand and on
  # every release tag, not on every push. Nothing here signs anything. The Mac
  # is not a job of its own: it is the iOS build, run on a different destination
  # (ADR-0011), and a GitHub runner cannot sign one without a real team.
  android:
    name: Android build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install
        run: npm ci

      - name: Generate the native project
        run: npx expo prebuild --platform android --no-install
        working-directory: expo/hermie

      # Release as well as Debug, deliberately. The template gives the debug
      # manifest keys the main one lacks — `usesCleartextTraffic` was exactly
      # that until ADR-0014 — so a debug-only job is blind to the configuration
      # every user actually runs. Release is also the only one that minifies.
      # Neither APK is signed with anything but the template's debug key.
      - name: Assemble
        run: ./gradlew assembleDebug assembleRelease --no-daemon
        working-directory: expo/hermie/android

      - uses: actions/upload-artifact@v4
        with:
          name: hermie-android-apks
          path: |
            expo/hermie/android/app/build/outputs/apk/debug/app-debug.apk
            expo/hermie/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  ios:
    name: iOS simulator build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate the native project
        run: npx expo prebuild --platform ios --no-install
        working-directory: expo/hermie

      - name: Pods
        run: pod install
        working-directory: expo/hermie/ios

      - name: Build
        working-directory: expo/hermie/ios
        run: |
          xcodebuild \
            -workspace Hermie.xcworkspace \
            -scheme Hermie \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
