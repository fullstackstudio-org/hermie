name: Release

# Everything here is the part of a release a machine can do on its own: build
# the artefacts that do not need a store account, and publish them against
# the tag with the CHANGELOG section for that version.
#
# The store halves — TestFlight, Play internal testing — are deliberately not
# here. They need an EAS project and credentials that belong to a person, and
# docs/release.md is the runbook for them. That now includes the Mac: since
# ADR-0011 it is the iOS build, which Apple offers on Apple Silicon Macs from
# the same App Store listing, so there is no downloadable .app to sign and
# notarise here any more.
#
# There is no web artefact: the browser client (`native/web`) is not released
# from here. It is built by the `web-client` job in ci.yml and shipped by the
# `hermie` gateway plugin, which imports a build and serves it (ADR-0030).
#
# Android signing is optional and guarded on the secrets being set, the way the
# macOS Developer ID signing used to be. With them, this produces a release APK
# and an app bundle signed with the Play upload key; without them, the debug APK
# a fork gets and nothing else fails. docs/release.md lists the four secrets.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Android artefacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: android-actions/setup-android@v4

      - name: Install
        run: npm ci

      - name: Generate the native project
        run: npx expo prebuild --platform android --no-install
        working-directory: expo/hermie

      # `secrets` is not available in a job-level `if`, so the presence of a key
      # becomes a step output that the steps below condition on. Only whether the
      # keystore secret is empty is ever tested; nothing is echoed.
      - name: Is there an upload key
        id: signing
        env:
          HERMIE_UPLOAD_KEYSTORE_BASE64: ${{ secrets.HERMIE_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$HERMIE_UPLOAD_KEYSTORE_BASE64" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'No upload key secret set; building the debug APK only.'
          fi

      # $RUNNER_TEMP, never the workspace: a keystore inside the checkout could be
      # picked up by a later step, and `actions/upload-artifact` takes paths by glob.
      - name: Decode the upload keystore
        if: steps.signing.outputs.available == 'true'
        env:
          HERMIE_UPLOAD_KEYSTORE_BASE64: ${{ secrets.HERMIE_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$HERMIE_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/upload.jks"

      # The debug APK is what a fork and a person sideloading get, and it is built
      # whether or not there is a key. Signed or not, an unsigned APK cannot be
      # installed at all, so there is never an unsigned artefact here.
      - name: Assemble the debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: expo/hermie/android

      # `ORG_GRADLE_PROJECT_<name>` is how Gradle takes a project property from the
      # environment, so these four arrive as the properties
      # plugins/with-android-release-signing.js reads. An unquoted secret is
      # important: a properties file keeps quote characters and Gradle does not
      # strip them, which is the trap the plugin's error message names.
      - name: Assemble and bundle the signed release
        if: steps.signing.outputs.available == 'true'
        working-directory: expo/hermie/android
        env:
          ORG_GRADLE_PROJECT_HERMIE_UPLOAD_STORE_FILE: ${{ runner.temp }}/signing/upload.jks
          ORG_GRADLE_PROJECT_HERMIE_UPLOAD_STORE_PASSWORD: ${{ secrets.HERMIE_UPLOAD_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_HERMIE_UPLOAD_KEY_ALIAS: ${{ secrets.HERMIE_UPLOAD_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_HERMIE_UPLOAD_KEY_PASSWORD: ${{ secrets.HERMIE_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease --no-daemon

      # Whatever else happens, the key does not outlive the job.
      - name: Remove the keystore
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing"

      - name: Name them after the tag
        run: |
          mkdir -p artifacts
          cp expo/hermie/android/app/build/outputs/apk/debug/app-debug.apk \
            "artifacts/Hermie-android-debug.apk"
          if [ '${{ steps.signing.outputs.available }}' = 'true' ]; then
            cp expo/hermie/android/app/build/outputs/apk/release/app-release.apk \
              "artifacts/Hermie-android-release.apk"
            cp expo/hermie/android/app/build/outputs/bundle/release/app-release.aab \
              "artifacts/Hermie-android-release.aab"
          fi
          ls -l artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: hermie-android
          path: artifacts/*
          if-no-files-found: error

  publish:
    name: GitHub release
    needs: [android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Release notes from the CHANGELOG
        run: node scripts/changelog-section.mjs "${GITHUB_REF_NAME#v}" > release-notes.md

      # Generated from whatever actually reached the release rather than written
      # by hand, so the list is never out of step with the files beside it.
      - name: Checksums
        working-directory: artifacts
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      # Whatever the build produced, rather than a fixed list: the release APK and
      # the app bundle are there only when the signing secrets were.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            artifacts/*
